# foot, matched to rv's default palette. `rv` runs one `foot --server` per
# session and opens windows with footclient: every terminal shares one
# process, its fonts and glyph cache.
font=Hack Nerd Font:size=11
pad=12x10 center
dpi-aware=no
term=xterm-256color
title=foot

[scrollback]
lines=10000

[cursor]
style=beam
beam-thickness=1.5

[mouse]
hide-when-typing=yes

[colors]
alpha=1.0
foreground=e5e1e7
background=131317
selection-foreground=131317
selection-background=c2c1ff
urls=8ba6ff

regular0=201f23
regular1=ff7185
regular2=83d6a2
regular3=f0c674
regular4=8ba6ff
regular5=c792ea
regular6=70d7e5
regular7=c8c5d1

bright0=595992
bright1=ff8fa3
bright2=a4e8bd
bright3=ffe19a
bright4=b7c4ff
bright5=e0aaff
bright6=9ce7ef
bright7=f4f0f6

[key-bindings]
scrollback-up-page=Shift+Page_Up
scrollback-down-page=Shift+Page_Down
search-start=Control+Shift+f
show-urls-launch=Control+Shift+o
font-increase=Control+plus Control+equal
font-decrease=Control+minus
font-reset=Control+0

[search-bindings]
cancel=Escape
find-prev=Shift+F3
find-next=F3 Control+g
