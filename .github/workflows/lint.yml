name: Lint

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ShellCheck
        run: shellcheck -x bin/rv install.sh tools/*.sh config/bash/rv.bash

      - name: Python
        run: python3 -m py_compile tui/*.py

      - name: JSON
        run: python3 -m json.tool config/rv/defaults.json >/dev/null

      - name: Lua syntax
        run: |
          sudo apt-get install -y -qq lua5.4 >/dev/null
          for f in config/hypr/hyprland.lua config/hypr/rv/*.lua; do luac5.4 -p "$f"; done
